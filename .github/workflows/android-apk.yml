
name: Build OM Tube Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking OM Tube project"
          ls -la
          find . -maxdepth 4 -name package.json

      - name: Confirm workflow
        run: echo "OM Tube workflow is running successfully"
        
