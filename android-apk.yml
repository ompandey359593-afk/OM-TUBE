name: Build OM Tube Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        working-directory: om_tube
        run: npm install

      - name: Generate Android project
        working-directory: om_tube
        run: npx cap add android

      - name: Sync web app into Android project
        working-directory: om_tube
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: om_tube/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OM-Tube-debug-APK
          path: om_tube/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
